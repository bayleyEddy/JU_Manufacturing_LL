<!DOCTYPE html>
<html>
<head>
    <title>Professor Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 30px;
        }

        h1 {
            margin: 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .signout-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .card h3 {
            margin-top: 0;
        }

        .status-green {
            color: #16a34a;
            font-weight: bold;
        }

        .student-box {
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-top: 10px;
        }

        .search-section {
            margin-top: 20px;
        }

        input[type="text"] {
            padding: 8px;
            width: 70%;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .search-btn {
            background-color: #111827;
            color: white;
        }

        .logout-btn {
            background-color: #ef4444;
            color: white;
            margin-top: 15px;
        }

        .attendance-list {
            margin-top: 10px;
        }

        .attendance-list li {
            margin-bottom: 5px;
        }

        @media(max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="top-bar">
    <div>
        <h1>Professor Dashboard</h1>
        <p>Welcome, Dr. Smith</p>
    </div>

    <a href="/professor_logout">
        <button class="signout-btn">Sign Out</button>
    </a>
</div>

<div class="dashboard">

    <!-- Left Column -->
    <div>

        <!-- Currently Signed In -->
        <div class="card">
            <h3>Currently Signed In (1)</h3>

            <div class="student-box">
                <strong>Dr. Smith</strong><br>
                ID: 001<br>
                Signed in at 06:39 PM
            </div>
        </div>

        <!-- Search Student -->
        <div class="card search-section">
            <h3>Search Student History</h3>

            <form id="searchForm">
                <input type="text" id="student_id" name="student_id" placeholder="Enter Student ID" required>
                <button type="submit" class="search-btn">Search</button>
            </form>

            <div id="searchResults"></div>
        </div>

    </div>

    <!-- Right Column -->
    <div>

        <div class="card" id="profileCard">
            <h3>Student Profile</h3>
            <p>Search for a student to view details.</p>
        </div>

    </div>

</div>

<script>
    const form = document.getElementById("searchForm");
    const profileCard = document.getElementById("profileCard");
    const searchResults = document.getElementById("searchResults");

    form.addEventListener("submit", async function(e) {
        e.preventDefault();

        const formData = new FormData(form);

        const response = await fetch("/professor_search", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (data.error) {
            searchResults.innerHTML = `<p style='color:red;'>${data.error}</p>`;
            return;
        }

        // Update profile card (right side)
        profileCard.innerHTML = `
            <h3>${data.first_name} ${data.last_name}</h3>
            <p><strong>Student ID:</strong> ${data.student_id}</p>
            <p><strong>Waiver:</strong> 
                <span class="status-green">${data.waiver}</span>
            </p>
            <h4>Attendance History</h4>
        `;

        if (data.logs.length === 0) {
            profileCard.innerHTML += "<p>No attendance records found.</p>";
        } else {
            profileCard.innerHTML += "<ul class='attendance-list'>";
            data.logs.forEach(log => {
                profileCard.innerHTML += `
                    <li>
                        Login: ${log.login} — Logout: ${log.logout}
                    </li>
                `;
            });
            profileCard.innerHTML += "</ul>";
        }

        // Optional: Show basic search result preview
        searchResults.innerHTML = `
            <div class="student-box">
                ${data.first_name} ${data.last_name} 
                <span class="status-green">✔ Waiver Signed</span>
            </div>
        `;
    });
</script>

</body>
</html>
