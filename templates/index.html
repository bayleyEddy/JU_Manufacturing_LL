<!DOCTYPE html>
<html>
<head>
    <title>Student Check-In</title>
    <style>
        body { 
            font-family: Arial; 
            margin: 0; 
            display: grid; 
            place-items: center; 
            background: url("https://www.cultofmac.com/wp-content/uploads/2016/08/ipad-dolphin-sea-world.gif") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            text-align: center;
            width: 300px;
        }

        input { width: 200px; padding: 5px; margin-bottom: 10px;}
        button { padding: 8px 15px; }
        #alertBox {
            display: none;
            padding: 10px;
            background-color: gold;
            margin-top: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">

        <h2>Student Check-In</h2>

        <form id="checkinForm">
            <label>Student ID:</label><br>
            <input type="text" id="student_id" name="student_id" required autofocus><br>
            <button type="submit">Check In / Out</button>
        </form>

        <div id="alertBox"></div>

    </div>

    <script>
        const input = document.getElementById("student_id");
        const form = document.getElementById("checkinForm");

        // Auto-process card swipe
        input.addEventListener("input", function () {
            let raw = this.value;

            if (raw.includes(";") && raw.includes("=") && raw.endsWith("?")) {
                let track2 = raw.split(";")[1];
                let parts = track2.split("=");
                let discretionary = parts[1].replace("?", "");
                let id = discretionary.slice(-6);

                this.value = id;
                this.blur();
                form.requestSubmit();
            }
        });

        // Submit handler with redirect support
        form.addEventListener("submit", async function(e) {
            e.preventDefault();

            const formData = new FormData(this);

            const response = await fetch("/checkin", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            const alertBox = document.getElementById("alertBox");
            alertBox.textContent = data.message;
            alertBox.style.display = "block";

            // Redirect ONLY if the user is NOT a regular student
            if (data.redirect && !data.redirect.includes("student_home")) {
                setTimeout(() => {
                    window.location.href = data.redirect;
                }, 1200);
            }

            setTimeout(() => {
                alertBox.style.display = "none";
                input.value = "";
                input.focus();
            }, 5000);
        });
    </script>

</body>
</html>
